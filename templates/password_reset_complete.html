<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - HealthyMe</title>
</head>
{% load static %}
<link rel="stylesheet" href="{% static 'css/mobile-fix.css' %}">
<style>
    @media (max-width: 768px) {
    body {
        overflow-x: hidden;
    }

    .container,
    .card,
    .form-box,
    .dashboard-container,
    .main-container {
        width: 92% !important;
        max-width: 92% !important;
        margin: 20px auto !important;
        padding: 20px !important;
    }

    h1 {
        font-size: 28px !important;
    }

    h2 {
        font-size: 24px !important;
    }

    input,
    button,
    textarea,
    select {
        width: 100% !important;
        font-size: 15px !important;
    }

    .btn,
    .button {
        width: 100% !important;
        margin-top: 10px !important;
    }

    table {
        display: block;
        width: 100% !important;
        overflow-x: auto;
        white-space: nowrap;
    }

    img {
        max-width: 100% !important;
        height: auto !important;
    }

    .navbar,
    .nav,
    .menu {
        flex-direction: column !important;
        gap: 10px !important;
    }
}
</style>
<body style="font-family:Arial; background:#eef7f1; text-align:center; padding:80px;">
    <div style="background:white; padding:30px; max-width:500px; margin:auto; border-radius:18px; box-shadow:0 8px 20px rgba(0,0,0,0.1);">
        <h2 style="color:#27ae60;">Password Reset Successful</h2>
        <p>Your password has been changed successfully.</p>
        <a href="/login/" style="display:inline-block; margin-top:15px; padding:10px 18px; background:#2ecc71; color:white; text-decoration:none; border-radius:8px;">Go to Login</a>
    </div>
</body>
</html>
