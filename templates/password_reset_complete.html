<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete - HealthyMe</title>
    <link rel="stylesheet" href="{% static 'css/mobile-fix.css' %}">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef7f1;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .box {
            width: 92%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h2 {
            color: #27ae60;
        }

        .login-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        @media screen and (max-width:768px){
            .box {
                width: 92% !important;
                max-width: 340px !important;
                padding: 22px !important;
            }

            h2 {
                font-size: 22px !important;
            }

            .login-btn {
                width: 100% !important;
            }
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Password Reset Successful</h2>
        <p>Your password has been changed successfully.</p>
        <a href="/login/" class="login-btn">Go to Login</a>
    </div>
</body>
</html>
