<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>Scan Product - HealthyMe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #222;
            min-height: 100vh;
            background:
                linear-gradient(rgba(255,255,255,0.84), rgba(255,255,255,0.84)),
                url("https://images.unsplash.com/photo-1542838132-92c53300491e");
            background-size: cover;
            background-position: center;
        }

        .container {
            width: 92%;
            max-width: 480px;
            margin: 45px auto;
            background: rgba(255,255,255,0.88);
            padding: 28px;
            border-radius: 24px;
            box-shadow: 0 14px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

        h2 {
            color: #1f8f4d;
        }

        #reader {
            width: 100%;
            min-height: 120px;
            margin: 18px auto;
            border-radius: 15px;
            overflow: hidden;
            background: #f5f5f5;
        }

        .barcode-box {
            background: #f5f5f5;
            padding: 14px;
            border-radius: 14px;
            margin: 18px 0;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .btn {
            background: linear-gradient(90deg, #1f8f4d, #2fbf71);
            border: none;
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn.secondary {
            background: #95a5a6;
        }

        input[type="text"],
        input[type="file"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8e3dd;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
        }

        .analyze-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            font-size: 16px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 18px;
            background: white;
            color: #1f8f4d;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #1f8f4d;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Scan Product</h2>
    <p>Scan barcode, upload barcode photo, or enter product name.</p>

    <form method="POST" action="{% url 'scan' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Scanner Window -->
        <div id="reader"></div>

        <!-- Barcode Result -->
        <div class="barcode-box">
            <strong>Detected Barcode</strong>
            <div id="barcodeText">Not scanned yet</div>
        </div>

        <!-- Hidden Barcode -->
        <input type="hidden" name="barcode" id="barcodeInput">

        <!-- Camera Selection -->
        <select id="cameraSelect"></select>

        <!-- Scanner Buttons -->
        <div class="btn-row">
            <button type="button" class="btn" onclick="startScanner()">Start Barcode Scan</button>
            <button type="button" class="btn secondary" onclick="stopScanner()">Stop</button>
        </div>

        <!-- Upload Option -->
        <h4>Or Upload Barcode Photo</h4>
        <input type="file" name="barcode_image" accept="image/*">

        <!-- Manual Entry -->
        <h4>Or Enter Product Name</h4>
        <input type="text" name="product_name" placeholder="Example: Hide & Seek">

        <!-- Submit -->
        <button type="submit" class="btn analyze-btn">Analyze Product</button>
    </form>

    <a href="/dashboard/" class="back-btn">⬅ Back to Dashboard</a>
</div>

<!-- Barcode Scanner Library -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
    let html5QrCode = null;
    let scannerRunning = false;
    let cameras = [];

    // Load available cameras
    async function loadCameras() {
        try {
            cameras = await Html5Qrcode.getCameras();

            const select = document.getElementById("cameraSelect");
            select.innerHTML = "";

            if (cameras.length === 0) {
                alert("No camera found!");
                return;
            }

            cameras.forEach((camera, index) => {
                let option = document.createElement("option");
                option.value = camera.id;
                option.text = camera.label || `Camera ${index + 1}`;
                select.appendChild(option);
            });

        } catch (err) {
            alert("Camera permission denied.");
            console.log(err);
        }
    }

    // Start scanner with selected camera
    async function startScanner() {
        try {
            if (scannerRunning) {
                await stopScanner();
            }

            const selectedCameraId = document.getElementById("cameraSelect").value;

            if (!selectedCameraId) {
                alert("Please select a camera first.");
                return;
            }

            html5QrCode = new Html5Qrcode("reader");

            await html5QrCode.start(
                selectedCameraId,
                {
                    fps: 10,
                    qrbox: { width: 280, height: 140 },
                    aspectRatio: 1.6
                },
                (decodedText) => {
                    if (decodedText && decodedText.length >= 8) {
                        document.getElementById("barcodeText").innerText = decodedText;
                        document.getElementById("barcodeInput").value = decodedText;
                        stopScanner();
                    }
                }
            );

            scannerRunning = true;

        } catch (err) {
            alert("Scanner failed: " + err);
            console.log(err);
        }
    }

    // Stop scanner
    async function stopScanner() {
        try {
            if (html5QrCode && scannerRunning) {
                await html5QrCode.stop();
                await html5QrCode.clear();
                scannerRunning = false;
            }
        } catch (err) {
            console.log(err);
        }
    }

    // Load cameras when page opens
    window.addEventListener("load", loadCameras);
</script>

</body>
</html>
