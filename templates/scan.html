<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <title>Scan Product - HealthyMe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/mobile-fix.css' %}">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #222;
            min-height: 100vh;
            overflow-x: hidden;
            background:
                linear-gradient(rgba(255,255,255,0.84), rgba(255,255,255,0.84)),
                url("https://images.unsplash.com/photo-1542838132-92c53300491e");
            background-size: cover;
            background-position: center;
            background-attachment: scroll;
        }

        .container {
            width: 92%;
            max-width: 480px;
            margin: 45px auto;
            background: rgba(255,255,255,0.88);
            padding: 28px;
            border-radius: 24px;
            box-shadow: 0 14px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #1f8f4d;
            font-size: 38px;
        }

        .subtext {
            color: #666;
            font-size: 14px;
        }

        #reader {
            width: 100%;
            min-height: 120px;
            margin: 18px auto;
            border-radius: 15px;
            overflow: hidden;
            background: #f5f5f5;
        }

        .barcode-box {
            background: #f5f5f5;
            padding: 14px;
            border-radius: 14px;
            margin: 18px 0;
            border: 1px solid #e7eee9;
        }

        .barcode-title {
            font-weight: bold;
            color: #1f2d3d;
        }

        .btn-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(90deg, #1f8f4d, #2fbf71);
            border: none;
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn.secondary {
            background: #95a5a6;
        }

        .section-title {
            text-align: left;
            font-size: 18px;
            margin: 18px 0 8px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8e3dd;
            border-radius: 10px;
            margin-top: 8px;
            font-size: 14px;
            background: white;
        }

        .analyze-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            font-size: 16px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 18px;
            background: white;
            color: #1f8f4d;
            text-decoration: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #1f8f4d;
        }

        .note {
            margin-top: 16px;
            font-size: 13px;
            color: #666;
            text-align: left;
            background: #f7fffa;
            padding: 12px;
            border-radius: 12px;
            border-left: 4px solid #2fbf71;
        }

        @media screen and (max-width:768px) {
            .container {
                width: 92% !important;
                max-width: 360px !important;
                margin: 20px auto !important;
                padding: 20px !important;
            }

            h2 {
                font-size: 26px !important;
            }

            .btn-row {
                flex-direction: column !important;
            }

            .btn,
            .back-btn,
            input[type="text"],
            input[type="file"] {
                width: 100% !important;
                font-size: 16px !important;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Scan Product</h2>
    <p class="subtext">Scan barcode, upload barcode photo, or enter product name.</p>

    <form method="POST" action="{% url 'scan' %}" enctype="multipart/form-data">
        {% csrf_token %}

        <div id="reader"></div>

        <div class="barcode-box">
            <div class="barcode-title">Detected Barcode</div>
            <div id="barcodeText">Not scanned yet</div>
        </div>

        <input type="hidden" name="barcode" id="barcodeInput">

        <div class="btn-row">
            <button type="button" class="btn" onclick="startScanner()">Start Barcode Scan</button>
            <button type="button" class="btn secondary" onclick="stopScanner()">Stop</button>
        </div>

        <div class="section-title">Or Upload Barcode Photo</div>
        <input type="file" name="barcode_image" accept="image/*">

        <div class="section-title">Or Enter Product Name</div>
        <input type="text" name="product_name" id="productName" placeholder="Example: Hide & Seek">

        <button type="submit" class="btn analyze-btn">Analyze Product</button>
    </form>

    <div style="text-align:center; margin-top:16px;">
        <a href="/dashboard/" class="back-btn">⬅ Back to Dashboard</a>
    </div>

    <div class="note">
        If barcode is not found, enter the product name manually.
    </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
    let html5QrCode = null;
    let scannerRunning = false;

    async function startScanner() {
        try {
            if (scannerRunning) return;

            const barcodeTextEl = document.getElementById("barcodeText");
            const barcodeInputEl = document.getElementById("barcodeInput");

            const devices = await Html5Qrcode.getCameras();
            if (!devices || devices.length === 0) {
                alert("No camera found on this device.");
                return;
            }

            html5QrCode = new Html5Qrcode("reader");

            await html5QrCode.start(
                devices[0].id,
                {
                    fps: 10,
                    qrbox: { width: 280, height: 140 },
                    aspectRatio: 1.6
                },
                (decodedText) => {
                    if (decodedText && decodedText.length >= 8) {
                        barcodeTextEl.innerText = decodedText;
                        barcodeInputEl.value = decodedText;
                        stopScanner();
                    }
                }
            );

            scannerRunning = true;

        } catch (err) {
            alert("Scanner failed: " + err);
        }
    }

    async function stopScanner() {
        try {
            if (html5QrCode && scannerRunning) {
                await html5QrCode.stop();
                await html5QrCode.clear();
                scannerRunning = false;
            }
        } catch (err) {
            console.log(err);
        }
    }
</script>

</body>
</html>
