<!DOCTYPE html>
<html>
<head>
    {% load static %}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - HealthyMe</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background:
                linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                url("https://images.unsplash.com/photo-1498837167922-ddd27525d352");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: rgba(255,255,255,0.96);
            padding: 70px 54px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1 {
            color: #27ae60;
            font-size: 26px;
            margin: 0 0 10px;
        }

        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border-radius: 30px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }

        .login-btn {
            background: #27ae60;
            color: white;
        }

        .register-btn {
            background: white;
            color: #27ae60;
            border: 2px solid #27ae60;
        }

        .small-text {
            font-size: 12px;
            margin-top: 18px;
            color: #777;
        }

        @media screen and (max-width: 480px) {
            body {
                align-items: center;
                padding: 16px;
                background-position: center top;
            }

            .card {
                max-width: 330px;
                padding: 24px 18px;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 12px;
            }

            .btn {
                font-size: 14px;
                padding: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Welcome to HealthyMe</h1>
        <p>Your smart companion for healthier food choices</p>

        <a href="/login/" class="btn login-btn">Login</a>
        <a href="/register/" class="btn register-btn">Register</a>

        <div class="small-text">
            Eat Smart • Live Healthy • Stay Fit
        </div>
    </div>
</body>
</html>
