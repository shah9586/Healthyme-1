<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - HealthyMe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef7f1;
        }
        .box {
            width: 380px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #27ae60;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
        }
        @media (max-width: 768px) {
    body {
        overflow-x: hidden;
    }

    .container,
    .card,
    .form-box,
    .dashboard-container,
    .main-container {
        width: 92% !important;
        max-width: 92% !important;
        margin: 20px auto !important;
        padding: 20px !important;
    }

    h1 {
        font-size: 28px !important;
    }

    h2 {
        font-size: 24px !important;
    }

    input,
    button,
    textarea,
    select {
        width: 100% !important;
        font-size: 15px !important;
    }

    .btn,
    .button {
        width: 100% !important;
        margin-top: 10px !important;
    }

    table {
        display: block;
        width: 100% !important;
        overflow-x: auto;
        white-space: nowrap;
    }

    img {
        max-width: 100% !important;
        height: auto !important;
    }

    .navbar,
    .nav,
    .menu {
        flex-direction: column !important;
        gap: 10px !important;
    }
}
    </style>
</head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<body>
    <div class="box">
        <h2>Verify OTP</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="otp" placeholder="Enter 6-digit OTP" required maxlength="6">
            <button type="submit">Verify OTP</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
