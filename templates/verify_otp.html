<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP - HealthyMe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
{% load static %}
<link rel="stylesheet" href="{% static 'css/mobile-fix.css' %}">
    <style>
       body {
    font-family: Arial, sans-serif;
    background: #eef7f1;

    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}
.box {
    width: 92%;
    max-width: 380px;

    background: white;
    padding: 25px;

    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}
        h2 {
            text-align: center;
            color: #27ae60;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
        }
     @media screen and (max-width:768px){

    .box{
        width:92% !important;
        max-width:340px !important;
        padding:22px !important;
    }

    h2{
        font-size:22px !important;
    }

    input,
    button{
        width:100% !important;
        font-size:16px !important;
    }
}
    </style>
</head>

<body>
    <div class="box">
        <h2>Verify OTP</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="otp" placeholder="Enter 6-digit OTP" required maxlength="6">
            <button type="submit">Verify OTP</button>
        </form>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
