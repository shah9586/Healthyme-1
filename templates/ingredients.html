<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
<link rel="stylesheet" href="{% static 'css/mobile-fix.css' %}">
    <title>Ingredients - HealthyMe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-attachment: scroll;

            background: linear-gradient(
                rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3)
            ),
            url("https://images.unsplash.com/photo-1546069901-ba9599a7e63c");

            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }

        .container {
    width: 92%;
    max-width: 800px;
    margin: 40px auto;

    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);

    padding: 25px;
    border-radius: 18px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    animation: fadeIn 1s ease;
}

        h1 {
            text-align: center;
            color: #1f8f4d;
            margin-bottom: 20px;
        }

        .item {
            background: #fff3f3;
            padding: 14px;
            border-left: 5px solid #e74c3c;
            border-radius: 12px;
            margin-bottom: 12px;
            transition: 0.3s;
        }

        .item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            background: #154b2c;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #45825e;
            transform: scale(1.05);
        }

        .center {
            text-align: center;
        }

        /* Floating elements */
        .floating {
            position: fixed;
            font-size: 80px;
            opacity: 0.45;
            animation: float 12s infinite linear;
        }

        .f1 { top: 15%; left: 5%; animation-delay: 0s; }
        .f2 { top: 60%; left: 90%; animation-delay: 3s; }
        .f3 { top: 80%; left: 25%; animation-delay: 6s; }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-40px); }
            100% { transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
       @media screen and (max-width:768px){

    body{
        overflow-x:hidden !important;
        background-attachment: scroll !important;
    }

    .container{
        width:92% !important;
        max-width:360px !important;
        padding:18px !important;
        margin:20px auto !important;
    }

    h1{
        font-size:24px !important;
    }

    .item{
        padding:12px !important;
        font-size:14px !important;
    }

    .btn{
        width:100% !important;
        font-size:16px !important;
    }

    .floating{
        display:none !important;
    }
}
.back-btn-wrap{
    text-align:center !important;
    margin-top:25px !important;
}

.back-dashboard-btn{
    display:inline-block !important;

    width:auto !important;
    min-width:220px !important;
    max-width:260px !important;

    padding:14px 22px !important;

    background:#145a32 !important;
    color:white !important;

    text-decoration:none !important;
    font-size:16px !important;
    font-weight:600 !important;

    border-radius:12px !important;

    box-shadow:0 5px 14px rgba(0,0,0,0.15) !important;
}

.back-dashboard-btn:hover{
    background:#0e4022 !important;
}

@media screen and (max-width:768px){

    .back-dashboard-btn{
        width:auto !important;
        min-width:220px !important;
        max-width:250px !important;

        padding:12px 18px !important;
        font-size:15px !important;
    }

}
@media screen and (max-width:768px){

    .floating{
        font-size:35px !important;   /* smaller */
        opacity:0.15 !important;     /* lighter */
    }

}
    </style>
</head>

<body>

    <!-- Floating icons -->
    <div class="floating f1">🥤</div>
    <div class="floating f2">🍫</div>
    <div class="floating f3">🍪</div>

    <div class="container">
        <h1>⚠️ Harmful Ingredients Found</h1>

        {% for item in harmful_items %}
            <div class="item">❌ {{ item }}</div>
        {% empty %}
            <p style="text-align:center;">✅ No harmful ingredients found yet.</p>
        {% endfor %}

      <div class="back-btn-wrap">
    <a href="/dashboard/" class="back-dashboard-btn">
        ← Back to Dashboard
    </a>
</div>
    </div>

</body>
</html>
