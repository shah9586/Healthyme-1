<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
{% load static %}
<link rel="stylesheet" href="{% static 'css/mobile-fix.css' %}">
    <title>Forgot Password - HealthyMe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef7f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            width: 400px;
        }
        h2 {
            text-align: center;
            color: #27ae60;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #27ae60;
        }
        @media (max-width: 768px) {
    body {
        overflow-x: hidden;
    }

    .container,
    .card,
    .form-box,
    .dashboard-container,
    .main-container {
        width: 92% !important;
        max-width: 92% !important;
        margin: 20px auto !important;
        padding: 20px !important;
    }

    h1 {
        font-size: 28px !important;
    }

    h2 {
        font-size: 24px !important;
    }

    input,
    button,
    textarea,
    select {
        width: 100% !important;
        font-size: 15px !important;
    }

    .btn,
    .button {
        width: 100% !important;
        margin-top: 10px !important;
    }

    table {
        display: block;
        width: 100% !important;
        overflow-x: auto;
        white-space: nowrap;
    }

    img {
        max-width: 100% !important;
        height: auto !important;
    }

    .navbar,
    .nav,
    .menu {
        flex-direction: column !important;
        gap: 10px !important;
    }
}
    </style>
</head>

<body>
    <div class="box">
        <h2>Forgot Password</h2>
        <p>Enter your email to receive a password reset link.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.email }}
            <button type="submit">Send Reset Link</button>
        </form>
    </div>
</body>
</html>
