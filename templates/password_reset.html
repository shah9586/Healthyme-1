<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
{% load static %}
<link rel="stylesheet" href="{% static 'css/mobile-fix.css' %}">
    <title>Forgot Password - HealthyMe</title>
    <style>
       body {
    font-family: Arial, sans-serif;
    background: #eef7f1;

    margin: 0;

    min-height: 100vh;
    overflow-x: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}
.box {
    background: white;

    width: 92%;
    max-width: 400px;

    padding: 30px;

    border-radius: 18px;

    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}
        h2 {
            text-align: center;
            color: #27ae60;
        }
        input[type="email"] {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #27ae60;
        }
       @media screen and (max-width:768px){

    .box{
        width:92% !important;
        max-width:340px !important;
        padding:22px !important;
    }

    h2{
        font-size:22px !important;
    }

    input,
    button{
        width:100% !important;
        font-size:16px !important;
    }
}
    </style>
</head>

<body>
    <div class="box">
        <h2>Forgot Password</h2>
        <p>Enter your email to receive a password reset link.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.email }}
            <button type="submit">Send Reset Link</button>
        </form>
    </div>
</body>
</html>
