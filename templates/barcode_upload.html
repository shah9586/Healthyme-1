<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode Scan - HealthyMe</title>
</head>
<style>
    @media (max-width: 768px) {
    body {
        overflow-x: hidden;
    }

    .container,
    .card,
    .form-box,
    .dashboard-container,
    .main-container {
        width: 92% !important;
        max-width: 92% !important;
        margin: 20px auto !important;
        padding: 20px !important;
    }

    h1 {
        font-size: 28px !important;
    }

    h2 {
        font-size: 24px !important;
    }

    input,
    button,
    textarea,
    select {
        width: 100% !important;
        font-size: 15px !important;
    }

    .btn,
    .button {
        width: 100% !important;
        margin-top: 10px !important;
    }

    table {
        display: block;
        width: 100% !important;
        overflow-x: auto;
        white-space: nowrap;
    }

    img {
        max-width: 100% !important;
        height: auto !important;
    }

    .navbar,
    .nav,
    .menu {
        flex-direction: column !important;
        gap: 10px !important;
    }
}
</style>
<body>
    <h2>Upload Barcode Image</h2>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    {% if barcode %}
        <p><b>Detected Barcode:</b> {{ barcode }}</p>
    {% endif %}

    {% if product_name %}
        <p><b>Product:</b> {{ product_name }}</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="barcode_image" accept="image/*" required>
        <br><br>
        <button type="submit">Scan Barcode</button>
    </form>
</body>
</html>
