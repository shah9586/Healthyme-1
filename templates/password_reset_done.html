<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent - HealthyMe</title>

    <style>
        body {
            font-family: Arial;
            background: #eef7f1;
            margin: 0;
        }

        /* 🔹 NAVBAR */
        .navbar {
            background: #27ae60;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        .login-btn {
            background: white;
            color: #27ae60;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #1abc9c;
            color: white;
        }

        /* 🔹 CARD */
        .card {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: 100px auto;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #27ae60;
        }
        @media (max-width: 768px) {
    body {
        overflow-x: hidden;
    }

    .container,
    .card,
    .form-box,
    .dashboard-container,
    .main-container {
        width: 92% !important;
        max-width: 92% !important;
        margin: 20px auto !important;
        padding: 20px !important;
    }

    h1 {
        font-size: 28px !important;
    }

    h2 {
        font-size: 24px !important;
    }

    input,
    button,
    textarea,
    select {
        width: 100% !important;
        font-size: 15px !important;
    }

    .btn,
    .button {
        width: 100% !important;
        margin-top: 10px !important;
    }

    table {
        display: block;
        width: 100% !important;
        overflow-x: auto;
        white-space: nowrap;
    }

    img {
        max-width: 100% !important;
        height: auto !important;
    }

    .navbar,
    .nav,
    .menu {
        flex-direction: column !important;
        gap: 10px !important;
    }
}
    </style>
</head>
{% load static %}
<link rel="stylesheet" href="{% static 'css/mobile-fix.css' %}">
<body>

<!-- 🔹 NAVBAR -->
<div class="navbar">
    <div class="logo">HealthyMe</div>
    <a href="/login/" class="login-btn">Login</a>
</div>

<!-- 🔹 CONTENT -->
<div class="card">
    <h2>Reset Link Sent</h2>
    <p>Please check your email for the password reset link.</p>
</div>

</body>
</html>
