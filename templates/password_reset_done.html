<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
{% load static %}
<link rel="stylesheet" href="{% static 'css/mobile-fix.css' %}">
    <title>Email Sent - HealthyMe</title>

    <style>
       body {
    font-family: Arial, sans-serif;
    background: #eef7f1;
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
}

        /* 🔹 NAVBAR */
        .navbar {
            background: #27ae60;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        .login-btn {
            background: white;
            color: #27ae60;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #1abc9c;
            color: white;
        }

        /* 🔹 CARD */
       .card {
    background: white;
    width: 92%;
    max-width: 500px;
    padding: 30px;
    margin: 100px auto;
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    text-align: center;
}

        h2 {
            color: #27ae60;
        }
        @media screen and (max-width:768px){

    .navbar {
        flex-direction: column !important;
        gap: 10px !important;
        padding: 15px !important;
        text-align: center !important;
    }

    .card {
        width: 92% !important;
        max-width: 340px !important;
        padding: 22px !important;
        margin: 40px auto !important;
    }

    h2 {
        font-size: 22px !important;
    }

    .login-btn {
        width: 100% !important;
        max-width: 180px !important;
        text-align: center !important;
    }
}
    </style>
</head>
<body>

<!-- 🔹 NAVBAR -->
<div class="navbar">
    <div class="logo">HealthyMe</div>
    <a href="/login/" class="login-btn">Login</a>
</div>

<!-- 🔹 CONTENT -->
<div class="card">
    <h2>Reset Link Sent</h2>
    <p>Please check your email for the password reset link.</p>
</div>

</body>
</html>
